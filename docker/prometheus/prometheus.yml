global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: paypilot-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/paypilot_metrics_token
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels:
          service: paypilot-api
          environment: local
