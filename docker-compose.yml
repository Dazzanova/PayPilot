services:
  postgres:
    image: postgres:16.4-alpine
    container_name: paypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      PAYPILOT_DB_NAME: ${PAYPILOT_DB_NAME:-paypilot}
      PAYPILOT_MIGRATOR_USER: ${PAYPILOT_MIGRATOR_USER:-paypilot_migrator}
      PAYPILOT_MIGRATOR_PASSWORD: ${PAYPILOT_MIGRATOR_PASSWORD:?PAYPILOT_MIGRATOR_PASSWORD is required}
      PAYPILOT_APP_USER: ${PAYPILOT_APP_USER:-paypilot_app}
      PAYPILOT_APP_PASSWORD: ${PAYPILOT_APP_PASSWORD:?PAYPILOT_APP_PASSWORD is required}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - paypilot-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: paypilot-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - paypilot-keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: paypilot-prometheus
    restart: unless-stopped
    # The secret is bind-mounted with the host file's owner/mode, so the token
    # must be world-readable inside the container. Keep .secrets/ at 0700 so
    # host users still cannot traverse to the file, and the token at 0644.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - paypilot-prometheus-data:/prometheus
      - ./docker/prometheus:/etc/prometheus:ro
    secrets:
      - paypilot_metrics_token
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  paypilot-postgres-data:
  paypilot-keycloak-data:
  paypilot-prometheus-data:

secrets:
  paypilot_metrics_token:
    file: ./.secrets/paypilot_metrics_token
